<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad en Años de Tortuga</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Edad en Años de Tortuga 🐢</h1>
        <p>Descubre cuántos años humanos tendría tu tortuga.</p>
        
        <form id="ageForm">
            <label for="turtleAge">Ingresa la edad de tu tortuga (en años reales):</label>
            <input type="number" id="turtleAge" placeholder="Ej: 7" min="0" required>
            <button type="submit">Calcular</button>
        </form>

        <div id="result" class="hidden">
            <h2>Resultado</h2>
            <p>La edad de tu tortuga en años humanos es: <span id="humanAge"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
